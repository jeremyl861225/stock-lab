name: daily-prediction

# 台股 13:30 收盤，法人買賣超約 15:00 後才完整。
# 排在台北 18:00（UTC 10:00），確保當日資料已齊。
on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # 刻意直接呼叫 daily.py prepare，而不是在這裡逐步重寫一次。
      #
      # 起因：這個檔案原本把 collect → panel → briefing → predict → settle
      # 一步一步展開，而 daily.py 後來加了新聞收集、K 線、美股季報與一年期滾動。
      # 兩邊於是安靜地分岔 —— 本機跑出來的面板有一年期論點與 K 線，
      # 排程跑出來的沒有，而且沒有任何一個環節會報錯。
      # 流程只能有一個定義。要改流程就改 src/daily.py。
      - name: 準備（收資料 → 特徵 → 簡報 → 模型 → 一年期滾動 → 結算 → 測試）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SEC_UA: ${{ secrets.SEC_UA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python src/daily.py prepare

      # 排程不做判斷 —— 判斷需要查證新聞、交叉驗證數字、發現資料異常，
      # 那是 DAILY.md 裡由人（或有工具的 Claude）走的流程。
      # 這裡只把既有判斷重新定價後呈現出來。
      - name: 產生期望值排序與面板
        run: |
          python src/ranking.py
          python src/panel.py

      - name: 提交（git 歷史＝不可竄改的稽核軌跡）
        run: |
          git config user.name  "stock-lab-bot"
          git config user.email "bot@users.noreply.github.com"
          # 只 add 實際存在的路徑。git add 對任何一個不存在的 pathspec 會整批
          # fatal 而**什麼都不暫存**，接著 commit「無事可提交」、push 回報
          # "Everything up-to-date"，整條鏈沒有一個環節出聲（2026-09-18 實際發生）。
          for p in data/predictions.jsonl data/settlements.jsonl \
                   data/reasoning.jsonl data/revisions.jsonl data/roll_1y_state.json \
                   data/news_seen.json docs judgments config/universe_latest.json \
                   config/universe config/universe_us config/universe_us_latest.json; do
            [ -e "$p" ] && git add "$p"
          done
          git diff --staged --quiet && { echo "沒有變更可提交"; exit 0; }
          git commit -m "daily: $(date -u +%Y-%m-%d)"
          git push
          # 提交後自驗，不要相信上一行的退出碼。
          git show --stat HEAD | head -30
